services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: phishguard
      POSTGRES_USER: phishguard
      POSTGRES_PASSWORD: phishguard_password
    ports:
      - "5432:5432"
    volumes:
      - phishguard_pg:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg2://phishguard:phishguard_password@postgres:5432/phishguard
      MODEL_DIR: /app/backend/ml/artifacts
      ENABLE_NETWORK_INTEL: "false"
    ports:
      - "8000:8000"

volumes:
  phishguard_pg:
